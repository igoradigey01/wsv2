
<div class="card">


  @if (flagView) {
    <div>
      <div class="imgs-body">
        @for (item of  productItems(); track item) {
          <div>
            <div (click)="changeProduct(item)">
              <!---    start -->
              <div class="img-body">
                <img class="img_block" src="{{ ImgObj(item) }}" />
              </div>
              <!--   endt -->
            </div>
          </div>
        }
      </div>
    </div>
  } @else {
    <div class="cards-body">
      @for (item of  productItems(); track item) {
        <div>
          <div (click)="changeProduct(item)">
            <!---    start -->
            <div class="card-body">
              <!--
              <div style="vertical-align: text-bottom; text-align: center">
                {{ item.name }}
              </div>
              -->
              <img class="img_block" src="{{ ImgObj(item) }}" />
              <div style="vertical-align: text-bottom; text-align: center">
                @if (!flagOpt) {
                  <span> Ц:{{ item.cost_total }}р </span>
                } @else {
                  Ц:{{ item.price }}
                }
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  }



</div>
